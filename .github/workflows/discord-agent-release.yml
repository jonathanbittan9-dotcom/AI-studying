name: discord-agent release

# Push a tag like "discord-agent-v0.2.0" to build the Docker image and publish
# it to GitHub Container Registry (ghcr.io) plus create a GitHub Release.
on:
  push:
    tags: ["discord-agent-v*"]

permissions:
  contents: write   # create the GitHub Release
  packages: write   # push to ghcr.io

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/discord-agent

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from tag
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#discord-agent-v}"
          PYPROJECT=$(grep -m1 '^version' langchain-deepagents/pyproject.toml | cut -d'"' -f2)
          if [ "$VERSION" != "$PYPROJECT" ]; then
            echo "::error::Tag version $VERSION does not match pyproject.toml version $PYPROJECT"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "minor=${VERSION%.*}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: langchain-deepagents
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.v.outputs.version }}
            ${{ env.IMAGE }}:${{ steps.v.outputs.minor }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "discord-agent v${{ steps.v.outputs.version }}" \
            --generate-notes \
            --notes "Docker image: \`docker pull ${{ env.IMAGE }}:${{ steps.v.outputs.version }}\`"
