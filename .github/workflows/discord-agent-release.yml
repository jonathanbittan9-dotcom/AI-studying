name: discord-agent release

# On every push to master that touches the bot, commitizen reads the
# conventional commits since the last "discord-agent-v*" tag and decides the
# next version (fix: -> patch, feat: -> minor). If there is something to
# release, it creates the tag + GitHub Release, then builds the Docker image.
on:
  push:
    branches: [master]
    paths: ["discord-agent/**"]

permissions:
  contents: write

concurrency:
  group: discord-agent-release

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.next.outputs.tag }}
    defaults:
      run:
        working-directory: discord-agent
    env:
      CZ: uvx --from commitizen==4.19.3 cz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Compute next version
        id: next
        run: |
          set +e
          version=$($CZ bump --get-next --yes)
          status=$?
          set -e
          if [ "$status" -eq 21 ]; then
            echo "No releasable commits since the last tag"
            exit 0
          fi
          [ "$status" -eq 0 ] || exit "$status"
          echo "tag=discord-agent-v$version" >> "$GITHUB_OUTPUT"

      - name: Create tag and release
        if: steps.next.outputs.tag
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.next.outputs.tag }}
        run: |
          previous=$(git describe --tags --abbrev=0 --match 'discord-agent-v*' 2>/dev/null || true)
          $CZ changelog --dry-run --unreleased-version "$TAG" ${previous:+--start-rev "$previous"} > notes.md
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes-file notes.md

  docker:
    needs: release
    if: needs.release.outputs.tag
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/discord-agent-docker.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
