[project]
name = "discord-agent"
version = "0.1.0"
description = "An AI agent that chats with, informs, and manages a Discord server."
requires-python = ">=3.12"


dependencies = [
    "deepagents>=0.7",
    "langchain-anthropic>=1.7",
    "langchain-google-genai>=4.4",
    "langchain-groq>=1.0",
    "python-dotenv>=1.0",
    "discord.py>=2.4",
    "colorlog>=6.8",
]


[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
discord-agent = "discord_agent.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/discord_agent"]


